name: Release

# Build, sign, and publish a GitHub Release whenever a version tag is pushed
# (e.g. `git tag v3.1.0 && git push origin v3.1.0`). tauri-action produces the
# NSIS installer, the signed updater artifact, and `latest.json` — which the app
# polls from the "latest" release for silent in-place updates.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater private key generated with `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Online metadata keys, baked into the binary at build time (see .env.example).
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Tracker ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # Emit latest.json (the updater manifest) alongside the installer.
          includeUpdaterJson: true

  # Build, sign, and attach the Android companion APK to the same Release, plus
  # apk-latest.json (the manifest the phone polls for its own in-app updates).
  # Tauri's updater plugin is desktop-only, so the phone uses a small custom flow
  # (see companion/src-tauri/src/update.rs + src/companion/update.ts).
  android:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: |
          sdkmanager "ndk;27.2.12479018" "build-tools;35.0.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Scaffold + patch the Android project
        run: |
          (cd companion && npx tauri android init --ci)
          # `tauri android init` scaffolds the project with the DEFAULT Tauri launcher
          # icons; regenerate the branded mipmaps into gen/android from the source art
          # (gen/android isn't committed, so this must run on every CI build).
          (cd companion && npx tauri icon ../_iconsrc/source-v2.png)
          node scripts/patch-android.mjs

      - name: Build APK
        run: cd companion && npx tauri android build

      - name: Sign APK with the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="companion/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "Unsigned APK not found at $UNSIGNED"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out GameTrackerRemote.apk aligned.apk
          "$BT/apksigner" verify --print-certs GameTrackerRemote.apk
          rm -f release.keystore aligned.apk

      - name: Write apk-latest.json
        env:
          APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/GameTrackerRemote.apk
        run: |
          node -e "const fs=require('fs'); const v=require('./companion/src-tauri/tauri.conf.json').version; fs.writeFileSync('apk-latest.json', JSON.stringify({ version: v, url: process.env.APK_URL, notes: '', pubDate: new Date().toISOString() }, null, 2))"
          cat apk-latest.json

      - name: Upload APK + manifest to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" GameTrackerRemote.apk apk-latest.json --clobber
