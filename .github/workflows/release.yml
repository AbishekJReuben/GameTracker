name: Release

# Build, sign, and publish a GitHub Release whenever a version tag is pushed
# (e.g. `git tag v3.9.6 && git push personal v3.9.6`).
#
# Job order (intentional — APK first so phone builds are checkable without waiting
# on the ~30 min Windows desktop build):
#   1. create-release  — open the GitHub Release for the tag (seconds)
#   2. android         — build/sign companion APK + apk-latest.json, upload
#   3. desktop         — tauri-action NSIS + updater latest.json, upload
#
# `needs` enforces that sequence. tauri-action uploads into the pre-created
# release via `releaseId` (it does not need to create the release itself).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Lightweight: open the Release so the APK job can attach assets immediately.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      # gh release create --verify-tag shells out to git, so the repo must be
      # checked out (with tags) or the job dies with "not a git repository".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitHub Release exists
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — reusing it"
          else
            gh release create "$TAG" \
              --title "Tracker $TAG" \
              --generate-notes \
              --verify-tag
          fi
          RID=$(gh release view "$TAG" --json id -q .id)
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Release id=$RID"

  # Build, sign, and attach the Android companion APK + apk-latest.json.
  # Runs BEFORE desktop so a bad APK is visible within minutes, not after the
  # Windows installer finishes. Tauri's updater plugin is desktop-only; the phone
  # uses the custom flow in companion/src-tauri/src/update.rs + src/companion/update.ts.
  android:
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + build-tools
        run: |
          sdkmanager "ndk;27.2.12479018" "build-tools;35.0.0" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Scaffold + patch the Android project
        run: |
          (cd companion && npx tauri android init --ci)
          # `tauri android init` scaffolds the project with the DEFAULT Tauri launcher
          # icons; regenerate the branded mipmaps into gen/android from the source art
          # (gen/android isn't committed, so this must run on every CI build).
          (cd companion && npx tauri icon ../_iconsrc/source-v2.png)
          node scripts/patch-android.mjs

      - name: Build APK
        run: cd companion && npx tauri android build

      - name: Sign APK with the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="companion/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          test -f "$UNSIGNED" || { echo "Unsigned APK not found at $UNSIGNED"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out GameTrackerRemote.apk aligned.apk
          "$BT/apksigner" verify --print-certs GameTrackerRemote.apk
          rm -f release.keystore aligned.apk

      - name: Write apk-latest.json
        env:
          APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/GameTrackerRemote.apk
        run: |
          node -e "const fs=require('fs'); const v=require('./companion/src-tauri/tauri.conf.json').version; fs.writeFileSync('apk-latest.json', JSON.stringify({ version: v, url: process.env.APK_URL, notes: '', pubDate: new Date().toISOString() }, null, 2))"
          cat apk-latest.json

      - name: Upload APK + manifest to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" GameTrackerRemote.apk apk-latest.json --clobber

  # Windows desktop NSIS + signed updater artifacts. Starts only after the APK
  # job succeeds so phone releases are verifiable first.
  desktop:
    runs-on: windows-latest
    needs: [create-release, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater private key generated with `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Online metadata keys, baked into the binary at build time (see .env.example).
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        with:
          # Upload into the release opened by create-release (do not recreate it).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Tracker ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # Emit latest.json (the updater manifest) alongside the installer.
          includeUpdaterJson: true
