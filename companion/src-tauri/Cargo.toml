[package]
name = "gametracker-companion"
version = "3.9.21"
description = "GameTracker Remote — phone companion"
authors = ["Abishek Reuben"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gametracker_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-app updater: download the release APK over HTTPS, then (on Android) hand it
# to the system package installer via JNI. Tauri's updater plugin is desktop-only.
# `gzip` pinned explicitly: if any hop force-compresses the body, ureq must
# transparently gunzip it back to the exact release bytes (a raw gzip-wrapped APK
# saved to disk is the "package appears to be invalid" corruption).
ureq = { version = "2", features = ["tls", "gzip"] }
# Verifies the downloaded APK against the sha256 published in apk-latest.json —
# the definitive integrity gate (catches every corruption/transcoding mode).
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Source of the Android JavaVM + activity for the JNI install path. tao 0.35+
# (under tauri 2.x) keeps its own per-activity context map and no longer fills in
# the `ndk-context` crate's global, so `ndk_context::android_context()` panics with
# "android context was not initialized" — we read tao's `main_android_context()`
# instead. Keep this in the same minor as the tao pinned by tauri-runtime-wry.
tao = { version = "0.35", default-features = false }

# NOTE: keep `panic = "unwind"` (the default) — do NOT set "abort" here.
# The in-app APK updater runs a lot of fallible JNI (FileProvider, the install
# intent, permission checks). Under `panic = "abort"` any panic on that path —
# or a pending Java exception on thread teardown — aborts the whole process, so a
# recoverable update failure showed up as the app "crashing / closing" instead of
# the intended "Update failed — tap to retry" banner. With unwind, `spawn_blocking`
# catches the panic and the command returns a clean error string the UI can show.
[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
