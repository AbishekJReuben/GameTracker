[package]
name = "gametracker-companion"
version = "3.7.0"
description = "GameTracker Remote — phone companion"
authors = ["Abishek Reuben"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gametracker_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-app updater: download the release APK over HTTPS, then (on Android) hand it
# to the system package installer via JNI. Tauri's updater plugin is desktop-only.
ureq = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
