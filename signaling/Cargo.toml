[package]
name = "gametracker-signal"
version = "0.1.0"
edition = "2021"
description = "Rendezvous/signaling server for GameTracker Remote WebRTC connections"

[[bin]]
name = "gametracker-signal"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Persistent, E2E-encrypted shared-clipboard store (the /clip namespace). The
# server only ever sees ciphertext + small metadata; image blobs live as files.
rusqlite = { version = "0.32", features = ["bundled"] }
# Serves the built discovery clients (companion + quest under signaling/static)
# so phones and the Meta Quest headset can open them over the same Cloudflare
# HTTPS tunnel — WebXR requires a secure context.
tower-http = { version = "0.5", features = ["fs", "cors"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
