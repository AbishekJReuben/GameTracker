# Fly.io deploy config for the GameTracker signaling server.
# Usage:  cd signaling && fly launch --copy-config --now   (or: fly deploy)
app = "gametracker-signal"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
