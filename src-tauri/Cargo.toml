[package]
name = "gametracker"
version = "3.1.4"
description = "Tracker — premium play & app analytics"
authors = ["Abishek Reuben"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gametracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

sysinfo = "0.32"
ureq = { version = "2", features = ["json"] }
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["time"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
