[package]
name = "gametracker"
version = "3.9.26"
description = "Tracker — premium play & app analytics"
authors = ["Abishek Reuben"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gametracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

sysinfo = "0.32"
ureq = { version = "2", features = ["json"] }
parking_lot = "0.12"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

# Remote-access server (companion phone app over Tailscale/LAN).
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
local-ip-address = "0.6"
xcap = "0.9.6"
enigo = "0.3.0"
base64 = "0.22"
# Fast screen-stream pipeline: SIMD downscale + SIMD (AVX2) JPEG encode. Both are
# pure Rust (no C/NASM build deps) so the Windows/Android builds stay turnkey.
# `rayon` spreads the SIMD resize across all cores — the downscale was the #2
# per-frame cost after capture, and single-threaded it left most cores idle.
fast_image_resize = { version = "5", features = ["rayon"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }
winreg = "0.52"
# Virtual Xbox 360 controller for remote play (a phone with a physical controller
# streams its state; we replay it as a real XInput device). Needs the ViGEmBus
# driver installed at runtime; pure-Rust client, Windows-only.
vigem-client = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The app is optimized for size, but the remote screen stream is CPU-bound number
# crunching (downscale + JPEG encode per frame) that "opt-level = s" throttles hard
# — it was the main cause of the low remote frame rate. Compile just the hot image
# crates for speed; the size cost is negligible and the fps win is large.
[profile.release.package.image]
opt-level = 3
[profile.release.package.fast_image_resize]
opt-level = 3
[profile.release.package.jpeg-encoder]
opt-level = 3
[profile.release.package.rayon]
opt-level = 3
[profile.release.package.rayon-core]
opt-level = 3
[profile.release.package.xcap]
opt-level = 3
