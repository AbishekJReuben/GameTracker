[package]
name = "gametracker-remote-probes"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["capture-probes"]
capture-probes = []

# Standalone probes import the shipping modules directly, without constructing a
# Tauri app, touching its database, or linking the application's large staticlib.
[[bin]]
name = "remote-overlay-probe"
path = "../../src-tauri/examples/remote_overlay_probe.rs"

[[bin]]
name = "remote-overlay-lifecycle-probe"
path = "../../src-tauri/examples/remote_overlay_lifecycle_probe.rs"

[[bin]]
name = "remote-overlay-visual-probe"
path = "../../src-tauri/examples/remote_overlay_visual_probe.rs"

[[bin]]
name = "remote-capture-probe"
path = "../../src-tauri/examples/remote_capture_probe.rs"

[[bin]]
name = "remote-combined-probe"
path = "../../src-tauri/examples/remote_combined_probe.rs"

[[bin]]
name = "remote-input-model-probe"
path = "../../src-tauri/examples/remote_input_model_probe.rs"

[[bin]]
name = "remote-stream-probe"
path = "../../src-tauri/examples/remote_stream_probe.rs"

[dependencies]
arc-swap = "1"
once_cell = "1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "bmp"] }
xcap = "0.9.6"
libloading = "0.8"
enigo = "0.3.0"
fast_image_resize = { version = "5", features = ["rayon"] }
jpeg-encoder = { version = "0.6", features = ["simd"] }
rayon = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "Foundation_Numerics", "Media", "Media_Control", "Storage_Streams",
  "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_Registry",
  "Win32_System_Com", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Media", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Storage_FileSystem"
] }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package.image]
opt-level = 3
